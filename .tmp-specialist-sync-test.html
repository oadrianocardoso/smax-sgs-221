<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>pending</title></head>
<body>
<script>
  window.SMAX = {
    config: {
      teamName: 'SGS 2.2.1',
      prefs: {
        highlightsOn: true,
        nameBadgesOn: true,
        magistradoOn: true,
        collapseOn: true,
        enlargeCommentsOn: true,
        autoTagsOn: true
      },
      supabase: { url: 'http://mock.local', enabled: true }
    }
  };

  const calls = [];
  let specialists = [
    { id: 10, team_id: 1, name: 'ALICE', nickname: '', bg_color: '#FFFFFF', fg_color: '#111111', is_absent: false, sort_order: 1, smax_person_id: null, smax_location: '', smax_person_name: 'Alice' },
    { id: 11, team_id: 1, name: 'BOB', nickname: '', bg_color: '#FFFFFF', fg_color: '#111111', is_absent: false, sort_order: 2, smax_person_id: 202, smax_location: 'X', smax_person_name: 'Bob' }
  ];
  let nextId = 12;

  window.fetch = async function () {
    return {
      ok: true,
      json: async function () {
        return { entities: [{ properties: { Id: 101, Name: 'Alice', Location: 'Teste' } }] };
      }
    };
  };

  window.GM_xmlhttpRequest = function (options) {
    const url = new URL(options.url);
    const resource = url.pathname.replace(/^\//, '');
    const method = options.method || 'GET';
    const body = options.data ? JSON.parse(options.data) : null;
    calls.push({ method, resource, query: url.search, body });
    let response = [];

    if (resource === 'smax_teams') {
      response = [{ id: 1, code: 'SGS 2.2.1', name: 'SGS 2.2.1', id_smax_grupo: 99, is_active: true }];
    } else if (resource === 'smax_specialists') {
      if (method === 'GET') {
        response = specialists;
      } else if (method === 'PATCH') {
        const id = Number(url.searchParams.get('id').replace('eq.', ''));
        specialists = specialists.map(function (row) {
          return row.id === id ? Object.assign({}, row, body, { id }) : row;
        });
        response = specialists.filter(function (row) { return row.id === id; });
      } else if (method === 'POST') {
        response = (Array.isArray(body) ? body : [body]).map(function (row) {
          const inserted = Object.assign({}, row, { id: nextId++ });
          specialists.push(inserted);
          return inserted;
        });
      } else if (method === 'DELETE') {
        const match = String(url.searchParams.get('id') || '').match(/in\.\(([^)]+)\)/);
        const ids = match ? match[1].split(',').map(Number) : specialists.map(function (row) { return row.id; });
        specialists = specialists.filter(function (row) { return !ids.includes(row.id); });
        response = [];
      }
    } else if (resource === 'smax_highlight_groups' && method === 'POST') {
      response = (Array.isArray(body) ? body : []).map(function (row, index) {
        return Object.assign({ id: index + 1 }, row);
      });
    } else if (resource === 'smax_feature_prefs') {
      response = method === 'GET' ? [] : null;
    } else {
      response = [];
    }

    setTimeout(function () {
      options.onload({ status: 200, responseText: response === null ? '' : JSON.stringify(response) });
    }, 0);
  };
</script>
<script src="modules/supabase-db.js"></script>
<script>
  (async function () {
    try {
      await window.SMAX.supabase.ready;
      await window.SMAX.supabase.saveAll({
        prefs: window.SMAX.config.prefs,
        teamName: 'SGS 2.2.1',
        teamGroupIds: { 'SGS 2.2.1': 99 },
        teams: {
          'SGS 2.2.1': {
            nameGroups: { ALICE: [1], CHARLIE: [2] },
            nameAliases: { ALICE: '', CHARLIE: '' },
            nameColors: {
              ALICE: { bg: '#FFFFFF', fg: '#111111' },
              CHARLIE: { bg: '#FFFFFF', fg: '#111111' }
            },
            ausentes: [],
            personMeta: {
              ALICE: { specialistId: 10, id: null, name: 'Alice', location: '' },
              CHARLIE: { specialistId: null, id: null, name: '', location: '' }
            }
          }
        },
        highlightGroups: {},
        detratores: [],
        autoTagRules: []
      });

      const alice = specialists.find(function (row) { return row.name === 'ALICE'; });
      const charlie = specialists.find(function (row) { return row.name === 'CHARLIE'; });
      const specialistDeletes = calls.filter(function (call) { return call.resource === 'smax_specialists' && call.method === 'DELETE'; });
      const specialistPatches = calls.filter(function (call) { return call.resource === 'smax_specialists' && call.method === 'PATCH'; });
      const result = {
        existingIdPreserved: !!alice && alice.id === 10,
        nullPersonIdPreserved: !!alice && alice.smax_person_id === null,
        newSpecialistInserted: !!charlie && charlie.id === 12,
        onlyRemovedIdDeleted: specialistDeletes.length === 1 && specialistDeletes[0].query.includes('id=in.(11)'),
        existingRowsPatched: specialistPatches.some(function (call) { return call.query.includes('id=eq.10'); }),
        noBlanketSpecialistDelete: !specialistDeletes.some(function (call) { return !call.query.includes('id='); })
      };
      const passed = Object.values(result).every(Boolean);
      document.title = passed ? 'PASS' : 'FAIL';
      const output = document.createElement('pre');
      output.id = 'test-result';
      output.textContent = JSON.stringify({ result, specialists, specialistDeletes, specialistPatches });
      document.body.appendChild(output);
    } catch (error) {
      document.title = 'ERROR';
      const output = document.createElement('pre');
      output.id = 'test-result';
      output.textContent = String(error && error.stack || error);
      document.body.appendChild(output);
    }
  })();
</script>
</body>
</html>
